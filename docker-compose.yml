services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mingri_menu
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - mingri-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mingri_menu"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mingri-postgres:
